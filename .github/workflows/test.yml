name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Jest tests
      id: jest
      run: |
        npm test
        echo "outcome=success" >> $GITHUB_OUTPUT
      continue-on-error: true

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      id: playwright
      run: |
        npm exec playwright test --reporter=junit --timeout=20000 --workers=1
        echo "outcome=success" >> $GITHUB_OUTPUT
      continue-on-error: true
      env:
        PLAYWRIGHT_BASE_URL: https://dev.d3r3rai463jny7.amplifyapp.com

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: test-results/
        retention-days: 7

    - name: Check test results
      run: |
        jest_outcome="${{ steps.jest.outputs.outcome || 'failure' }}"
        playwright_outcome="${{ steps.playwright.outputs.outcome || 'failure' }}"
        echo "Jest: $jest_outcome / Playwright: $playwright_outcome"
        if [ "$jest_outcome" != "success" ] || [ "$playwright_outcome" != "success" ]; then
          echo "::error::Tests failed (jest=$jest_outcome, playwright=$playwright_outcome)"
          exit 1
        fi